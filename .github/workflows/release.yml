# Packt das Addon bei jedem Git-Tag und lädt es hoch.
# Tag mit "beta" (z. B. v0.6.0-beta) -> Beta auf CurseForge, "alpha" -> Alpha, sonst Release.
name: Package and release

on:
  push:
    tags:
      - "**"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # für das GitHub-Release
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}     # CurseForge (Schritt 7)
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }} # optional, Wago
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}     # automatisch vorhanden
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ganze Historie, damit der Packager Tags und Version erkennt

      - uses: BigWigsMods/packager@v2
